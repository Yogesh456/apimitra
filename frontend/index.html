<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ApiMitra" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ApiMitra</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Instant boot splash: shown before React mounts, removed on first render -->
    <div id="boot-splash">
      <div class="bs-inner">
        <div class="bs-logo">🔍</div>
        <div class="bs-title">ApiMitra</div>
        <div class="bs-tag">Your API Services Platform</div>
        <div class="bs-bar"><span></span></div>
      </div>
      <div class="bs-foot">Loading secure session…</div>
    </div>

    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 55%, #2563eb 100%);
        color: #fff; font-family: 'Inter', -apple-system, sans-serif;
        transition: opacity .4s ease; text-align: center; padding: 24px;
      }
      #boot-splash.bs-hide { opacity: 0; pointer-events: none; }
      #boot-splash .bs-inner { display: flex; flex-direction: column; align-items: center; }
      #boot-splash .bs-logo {
        width: 88px; height: 88px; border-radius: 26px; font-size: 44px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
        backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0,0,0,.25);
        animation: bsPop .6s cubic-bezier(.2,.8,.2,1) both, bsFloat 2.6s ease-in-out infinite .6s;
      }
      #boot-splash .bs-title { margin-top: 20px; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
      #boot-splash .bs-tag { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.72); }
      #boot-splash .bs-bar {
        margin-top: 26px; width: 160px; height: 5px; border-radius: 99px;
        background: rgba(255,255,255,.22); overflow: hidden;
      }
      #boot-splash .bs-bar span {
        display: block; height: 100%; width: 40%; border-radius: 99px;
        background: #fff; animation: bsSlide 1.1s ease-in-out infinite;
      }
      #boot-splash .bs-foot { position: absolute; bottom: 34px; font-size: 12px; color: rgba(255,255,255,.6); }

      /* Desktop variant: bigger logo, wider bar, subtle side glow */
      @media (min-width: 768px) {
        #boot-splash .bs-logo { width: 110px; height: 110px; border-radius: 32px; font-size: 56px; }
        #boot-splash .bs-title { font-size: 40px; margin-top: 26px; }
        #boot-splash .bs-tag { font-size: 15px; }
        #boot-splash .bs-bar { width: 240px; }
      }

      @keyframes bsPop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
      @keyframes bsFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes bsSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
